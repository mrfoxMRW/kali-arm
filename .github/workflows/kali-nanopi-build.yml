name: Build Kali Linux for NanoPi

on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发编译

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # 确保子模块也被拉取，通常构建脚本依赖子模块

      - name: 执行官方依赖脚本 (build_deps.sh)
        run: |
          echo "🚀 开始执行环境配置脚本..."
          if [ -f ./common.d/build_deps.sh ]; then
            chmod +x ./common.d/build_deps.sh
            # 官方脚本通常会自动处理 apt 源更新和依赖安装
            sudo ./common.d/build_deps.sh
          else
            echo "❌ 错误：未找到 ./common.d/build_deps.sh"
            exit 1
          fi

      - name: 执行 NanoPi 构建脚本
        run: |
          echo "🚀 开始构建 NanoPi Neo Plus2 镜像..."
          if [ -f ./nanopi-neo-plus2.sh ]; then
            chmod +x ./nanopi-neo-plus2.sh
            export TERM=xterm
            # 使用 sudo -E 传递环境变量执行构建
            sudo -E ./nanopi-neo-plus2.sh
          else
            echo "❌ 错误：未找到 ./nanopi-neo-plus2.sh"
            exit 1
          fi

      - name: 检查编译产物 (images/)
        run: |
          echo "📦 检查输出目录..."
          if [ -d "images" ]; then
            ls -lh images/
            # 验证是否存在预期的压缩镜像文件
            if ls images/*.img.xz 1> /dev/null 2>&1; then
              echo "✅ 成功找到 .img.xz 文件"
            else
              echo "⚠️  未在 images/ 中找到 .img.xz 文件。"
              echo "🔍 目录内所有文件列表："
              find images/ -type f
              # 如果找不到 .img.xz 则报错，防止上传空制品
              exit 1
            fi
          else
            echo "❌ 错误：images/ 目录不存在，构建可能失败。"
            exit 1
          fi

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: kali-linux-nanopi-neo-plus2-arm64
          path: images/*.img.xz
          if-no-files-found: error
          retention-days: 7
