name: Build Kali Linux for NanoPi
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发编译

jobs:
  build:
    runs-on: ubuntu-22.04 # 云服务器系统，选Ubuntu 22.04（兼容Kali构建）
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装构建依赖和交叉编译工具链
        run: |
          sudo apt update && sudo apt install -y \
            debootstrap \
            qemu-user-static \
            device-tree-compiler \
            lzma \
            lzop \
            u-boot-tools \
            pixz \
            gcc-aarch64-linux-gnu \
            git

      - name: 配置交叉编译环境
        run: |
          echo "ARCH=arm64" >> $GITHUB_ENV
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV
          echo "TERM=xterm" >> $GITHUB_ENV # 强制设置终端类型

      - name: 执行NanoPi构建脚本（关键：去掉版本号参数）
        run: |
          chmod +x ./nanopi-neo-plus2.sh
          export TERM=xterm
          sudo -E ./nanopi-neo-plus2.sh # 这里去掉了 "2025.4"

      - name: 上传编译产物（img.xz镜像）
        uses: actions/upload-artifact@v4
        with:
          name: kali-linux-nanopi-neo-plus2-arm64
          path: ./*.img.xz # 编译后的镜像包，自动上传到GitHub
