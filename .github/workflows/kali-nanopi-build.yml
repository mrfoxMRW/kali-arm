name: Build Kali Linux for NanoPi
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 支持手动触发编译

jobs:
  build:
    runs-on: ubuntu-22.04 # 云服务器系统，选Ubuntu 22.04（兼容Kali构建）
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装构建依赖
        run: |
          sudo apt update && sudo apt install -y debootstrap qemu-user-static device-tree-compiler lzma lzop u-boot-tools pixz gcc-arm-none-eabi git
          sudo dpkg --add-architecture i386 && sudo apt update && sudo apt install -y libncurses5:i386

      - name: 配置交叉编译环境
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          mkdir -p ~/arm-stuff/toolchains
          git clone https://gitlab.com/kalilinux/packages/gcc-arm-eabi-linaro.git ~/arm-stuff/toolchains/

      - name: 执行NanoPi构建脚本（关键：替换为你的设备脚本）
        run: |
          chmod +x ./nanopi-neo-plus2.sh # 替换为nanopi-neo-plus2.sh/nanopc-t.sh
          sudo ./nanopi-neo-plus2.sh 2025.4 # 编译Kali 2025.4版本

      - name: 上传编译产物（img.xz镜像）
        uses: actions/upload-artifact@v4
        with:
          name: kali-linux-2025.4-nanopi-neo-plus2-arm64
          path: ./*.img.xz # 编译后的镜像包，自动上传到GitHub
